<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Wishlist | SOLESYNTAX</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rokkitt:wght@100;300;400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

  <style>
    /* ===== Brand Colors ===== */
    :root {
      --primary: #88c8bc;
      --primary-dark: #66a59b;
      --secondary: #46698f;
      --accent: #ff6b6b;
      --light: #f8f9fa;
      --dark: #343a40;
      --gray-light: #e9ecef;
      --gray: #ced4da;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --border-radius: 10px;
      --font-main: 'Poppins', sans-serif;
    }

    body {
      font-family: var(--font-main);
      background-color: #f8f9fa;
      padding-top: 20px;
    }

    .main-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .wishlist-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .wishlist-header h2 {
      font-family: 'Rokkitt', Georgia, serif;
      font-size: 32px;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 5px;
    }
    .wishlist-header p {
      color: #6c757d;
      font-size: 16px;
    }

    .wishlist-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 25px;
    }
    .clear-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .clear-btn:hover {
      background: #e55a5a;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255,107,107,0.3);
    }
    .wishlist-count {
      color: #6c757d;
      font-size: 15px;
    }
    .wishlist-count strong {
      color: var(--dark);
    }

    /* ===== Wishlist Grid ===== */
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
      width: 100%;
      align-content: start;
    }

    /* ===== Wishlist Card ===== */
    .wishlist-card {
      background: white;
      border-radius: var(--border-radius);
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .wishlist-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
    }
    .wishlist-card .product-image-container {
      position: relative;
      padding-top: 100%;
      overflow: hidden;
      background: #f5f5f5;
      flex-shrink: 0;
    }
    .wishlist-card img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .wishlist-card:hover img {
      transform: scale(1.05);
    }
    .wishlist-card .product-info {
      padding: 16px 18px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .wishlist-card h4 {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 6px !important;
      color: var(--dark);
      font-family: 'Rokkitt', var(--font-main);
      line-height: 1.3;
    }
    .wishlist-card .product-price {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .wishlist-card .sale-price {
      font-size: 17px;
      font-weight: 600;
      color: var(--primary-dark);
    }
    .wishlist-card .regular-price {
      font-size: 13px;
      color: #adb5bd;
      text-decoration: line-through;
      margin-left: 8px;
    }

    /* ===== Size & Quantity Row ===== */
    .wishlist-options {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .wishlist-options .size-select {
      flex: 2;
      min-width: 80px;
      padding: 6px 8px;
      border: 1px solid var(--gray);
      border-radius: 6px;
      font-size: 13px;
      background: white;
    }
    .wishlist-options .qty-control {
      display: flex;
      align-items: center;
      border: 1px solid var(--gray);
      border-radius: 6px;
      overflow: hidden;
      background: white;
    }
    .wishlist-options .qty-control button {
      background: transparent;
      border: none;
      width: 30px;
      height: 32px;
      cursor: pointer;
      font-size: 16px;
      color: #6c757d;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wishlist-options .qty-control button:hover {
      background: var(--light);
    }
    .wishlist-options .qty-control input {
      width: 36px;
      text-align: center;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      padding: 4px 0;
    }
    .wishlist-options .qty-control input::-webkit-outer-spin-button,
    .wishlist-options .qty-control input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .wishlist-options .qty-control input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    /* ===== Action Buttons ===== */
    .wishlist-actions-buttons {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .btn-move-cart {
      flex: 1;
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s;
      text-align: center;
      text-decoration: none;
    }
    .btn-move-cart:hover {
      background: var(--primary-dark);
    }
    .btn-remove {
      background: transparent;
      color: #dc3545;
      border: 1.5px solid #dc3545;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-remove:hover {
      background: #dc3545;
      color: white;
    }

    /* ===== Empty State ===== */
    .empty-wishlist {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
    }
    .empty-wishlist i {
      font-size: 60px;
      color: #ddd;
      margin-bottom: 20px;
    }
    .empty-wishlist h3 {
      font-family: 'Rokkitt', Georgia, serif;
      font-size: 28px;
      color: var(--dark);
      margin-bottom: 10px;
    }
    .empty-wishlist p {
      color: #6c757d;
      font-size: 16px;
      max-width: 400px;
      margin: 0 auto 20px;
    }
    .empty-wishlist .shop-link {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 10px 30px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.3s;
    }
    .empty-wishlist .shop-link:hover {
      background: var(--primary-dark);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .wishlist-actions { flex-direction: column; align-items: stretch; }
      .clear-btn { text-align: center; justify-content: center; }
      .wishlist-grid { grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); }
    }
    @media (max-width: 576px) {
      .wishlist-grid { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 15px; }
      .wishlist-card h4 { font-size: 15px; }
      .sale-price { font-size: 15px; }
      .wishlist-options .size-select { min-width: 60px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="main-container">
  <section class="wishlist-page">
    <div class="wishlist-header">
      <h2><i class="fas fa-heart" style="color:var(--accent);"></i> My Wishlist</h2>
      <p>Your saved items – ready when you are</p>
    </div>

    <div class="wishlist-actions">
      <div class="wishlist-count">
        <strong>4</strong> items in your wishlist
      </div>
      <a href="#" class="clear-btn" onclick="return confirm('Remove all items from wishlist?')">
        <i class="fas fa-trash-alt"></i> Clear Wishlist
      </a>
    </div>

    <!-- Wishlist Grid -->
    <div class="wishlist-grid">
      <!-- Sample Product 1 -->
      <div class="wishlist-card">
        <div class="product-image-container">
          <img src="https://via.placeholder.com/400x400/88c8bc/fff?text=Shoe" alt="Nike Air Max">
        </div>
        <div class="product-info">
          <h4>Nike Air Max</h4>
          <div class="product-price">
            <span class="sale-price">₹4,499</span>
            <span class="regular-price">₹6,499</span>
          </div>

          <!-- Size + Quantity -->
          <div class="wishlist-options">
            <select class="size-select">
              <option value="UK6">UK 6</option>
              <option value="UK7" selected>UK 7</option>
              <option value="UK8">UK 8</option>
              <option value="UK9">UK 9</option>
              <option value="UK10">UK 10</option>
            </select>
            <div class="qty-control">
              <button type="button" class="qty-minus">−</button>
              <input type="number" value="1" min="1" max="5" class="qty-input" />
              <button type="button" class="qty-plus">+</button>
            </div>
          </div>

          <div class="wishlist-actions-buttons">
            <button class="btn-move-cart move-cart-btn"><i class="fas fa-shopping-cart"></i> Move to Cart</button>
            <button class="btn-remove remove-btn"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      </div>

      <!-- Sample Product 2 -->
      <div class="wishlist-card">
        <div class="product-image-container">
          <img src="https://via.placeholder.com/400x400/88c8bc/fff?text=Boot" alt="Leather Boots">
        </div>
        <div class="product-info">
          <h4>Leather Boots</h4>
          <div class="product-price">
            <span class="sale-price">₹5,999</span>
            <span class="regular-price">₹7,199</span>
          </div>
          <div class="wishlist-options">
            <select class="size-select">
              <option value="UK6">UK 6</option>
              <option value="UK7">UK 7</option>
              <option value="UK8" selected>UK 8</option>
              <option value="UK9">UK 9</option>
              <option value="UK10">UK 10</option>
            </select>
            <div class="qty-control">
              <button type="button" class="qty-minus">−</button>
              <input type="number" value="1" min="1" max="5" class="qty-input" />
              <button type="button" class="qty-plus">+</button>
            </div>
          </div>
          <div class="wishlist-actions-buttons">
            <button class="btn-move-cart move-cart-btn"><i class="fas fa-shopping-cart"></i> Move to Cart</button>
            <button class="btn-remove remove-btn"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- JavaScript for QTY +/-, Move, Remove, Clear -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // ---- Quantity +/- ----
    document.querySelectorAll('.qty-control').forEach(control => {
      const input = control.querySelector('.qty-input');
      const minus = control.querySelector('.qty-minus');
      const plus = control.querySelector('.qty-plus');
      minus.addEventListener('click', () => {
        let val = parseInt(input.value) || 1;
        if (val > 1) input.value = val - 1;
      });
      plus.addEventListener('click', () => {
        let val = parseInt(input.value) || 1;
        let max = parseInt(input.max) || 5;
        if (val < max) input.value = val + 1;
      });
      input.addEventListener('change', () => {
        let val = parseInt(input.value) || 1;
        let max = parseInt(input.max) || 5;
        if (val < 1) input.value = 1;
        if (val > max) input.value = max;
      });
    });

    // ---- Move to Cart ----
    document.querySelectorAll('.move-cart-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const card = this.closest('.wishlist-card');
        const size = card.querySelector('.size-select').value;
        const qty = card.querySelector('.qty-input').value;
        const productName = card.querySelector('h4').textContent;
        alert(`Added ${qty} x ${productName} (Size: ${size}) to cart!`);
        // In a real app, submit a form or AJAX
      });
    });

    // ---- Remove ----
    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (confirm('Remove this item from wishlist?')) {
          this.closest('.wishlist-card').remove();
          updateCount();
        }
      });
    });

    // ---- Clear All ----
    document.querySelector('.clear-btn').addEventListener('click', function(e) {
      e.preventDefault();
      if (confirm('Remove all items from wishlist?')) {
        const grid = document.querySelector('.wishlist-grid');
        grid.innerHTML = `
          <div class="empty-wishlist">
            <i class="fas fa-heart-broken"></i>
            <h3>Your wishlist is empty</h3>
            <p>Start adding your favourite items – they’ll be saved here for later.</p>
            <a href="/shop" class="shop-link">Start Shopping</a>
          </div>
        `;
        updateCount();
      }
    });

    function updateCount() {
      const cards = document.querySelectorAll('.wishlist-card');
      const count = cards.length;
      document.querySelector('.wishlist-count strong').textContent = count;
    }
  });
</script>

</body>
</html>
